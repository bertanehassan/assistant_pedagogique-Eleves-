<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Dégradé Rouge Marocain -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23038" />
      <stop offset="100%" stop-color="#9E151B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Motif Zellige Subtil en arrière-plan -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="0.5">
    <path d="M 0 32 L 64 32 M 32 0 L 32 64 M 0 0 L 64 64 M 0 64 L 64 0" />
    <circle cx="32" cy="32" r="24" fill="none" />
    <circle cx="32" cy="32" r="16" fill="none" />
  </g>

  <!-- Livre stylisé (Éducation) -->
  <path d="M32 20 C32 20 26 14 16 14 C10 14 8 18 8 18 V48 C8 48 10 44 16 44 C26 44 32 50 32 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M32 20 C32 20 38 14 48 14 C54 14 56 18 56 18 V48 C56 48 54 44 48 44 C38 44 32 50 32 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M32 20 V50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Étoile Marocaine (Pentagramme Vert) -->
  <g transform="translate(32, 28) scale(1)" filter="url(#glow)">
    <!-- Pentagramme parfait dessiné en une seule ligne -->
    <path d="M 0 -13.5 L 7.93 10.93 L -12.84 -4.17 L 12.84 -4.17 L -7.93 10.93 Z" fill="none" stroke="#009639" stroke-width="2" stroke-linejoin="miter" stroke-miterlimit="4"/>
  </g>
</svg>